# Render Blueprint — Signal Forge (API + static frontend + Postgres)
# Dashboard: https://dashboard.render.com → New → Blueprint → connect this repo
#
# After first deploy:
# 1. Open the static site URL and API URL
# 2. Confirm CORS_ORIGINS on the API matches the static site URL
# 3. Log in with DEFAULT_ADMIN_EMAIL / DEFAULT_ADMIN_PASSWORD, then change the password
# 4. In Admin, run data refresh / pipeline (cold start has empty market history)

databases:
  - name: signal-forge-db
    databaseName: signalforge
    user: signalforge
    plan: basic-256mb

services:
  - type: web
    name: signal-forge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: signal-forge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@signalforge.app
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        # Update if your static site gets a different URL
        value: https://signal-forge-web.onrender.com

  - type: web
    name: signal-forge-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Must match the API service public URL (no trailing slash)
        value: https://signal-forge-api.onrender.com
